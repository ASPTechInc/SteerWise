# CI means Continuous Integration.
# This workflow handles the SteerWise Flutter/Dart build pipeline, running
# format checks, static analysis, Flutter tests and building the Android APK.
name: SteerWise CI

on:
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' # Skip the entire workflow for Dependabot pull requests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run analyser
        run: flutter analyze

  unit-test:
    name: Flutter tests
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' # Skip the entire workflow for Dependabot pull requests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' # Skip the entire workflow for Dependabot pull requests
    env:
      ANDROID_HOME: ${{ vars.ANDROID_HOME || '/usr/local/lib/android/sdk' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Android SDK
        run: |
          echo "Using ANDROID_HOME: $ANDROID_HOME"
          if [ -d "$ANDROID_HOME" ]; then
            echo "SDK directory exists."
            ls -ld "$ANDROID_HOME"
          else
            echo "Error: SDK directory not found at $ANDROID_HOME"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        if: ${{ !env.ACT }} # Accounts for 'act' not having a ACTIONS_RUNTIME_TOKEN
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
