# pre-commit hooks for SteerWise. See https://pre-commit.com
#
# Set up (see docs/md/developer-notes.md#enable-pre-commit-in-repository):
#   pip install pre-commit
#   pre-commit install
#
# Run against every file:
#   pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: scaffold-dart
        name: Add SteerWise header to Dart files
        entry: ./scripts/scaffold.sh dart
        language: script
        types: [dart]
        files: ^(lib|test)/

      - id: scaffold-md
        name: Add SteerWise header to documentation
        entry: ./scripts/scaffold.sh md
        language: script
        types: [markdown]
        files: ^docs/md/

      - id: import-sorter
        name: Sort Dart imports
        entry: dart run import_sorter:main
        language: system
        types: [dart]
        pass_filenames: false

      - id: dart-format
        name: Format Dart code
        entry: dart format
        language: system
        types: [dart]

      - id: flutter-analyse
        name: Analyse Dart code
        entry: flutter analyze --no-fatal-infos
        language: system
        types: [dart]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files # 500 KB limit; screenshots are under 300 KB
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
